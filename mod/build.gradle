plugins {
    // Unobfuscated Loom for Minecraft 26.1+. It does not remap Minecraft or mods.
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    // Bundles JDA and its libraries into the mod jar, moved to our own package names
    // so they cannot clash with anything another mod ships.
    id 'com.gradleup.shadow' version "${shadow_version}"
}

version = project.mod_version
group = project.maven_group

base { archivesName = 'guildbridge' }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

repositories { mavenCentral() }

// Compile core's sources and resources straight into the mod jar.
sourceSets.main.java.srcDir '../core/src/main/java'
sourceSets.main.resources.srcDir '../core/src/main/resources'

configurations {
    shade
    implementation.extendsFrom shade
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // No mappings line: 26.x ships with real names.
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    shade("net.dv8tion:JDA:${jda_version}") {
        exclude module: 'opus-java'   // voice audio, not needed
        exclude group: 'org.slf4j'    // Minecraft already provides SLF4J
    }
}

processResources {
    def props = [version: version, loader_version: loader_version, minecraft_version: minecraft_version]
    inputs.properties props
    filesMatching('fabric.mod.json') { expand props }
}

// The plain jar (without JDA) is only an intermediate.
jar { archiveClassifier = 'slim' }

shadowJar {
    configurations = [project.configurations.shade]
    archiveClassifier = ''
    mergeServiceFiles()
    def base = 'com.guildbridge.shadow.'
    ['okhttp3', 'okio', 'kotlin', 'com.fasterxml', 'gnu.trove', 'com.neovisionaries',
     'org.apache.commons.collections4', 'org.jetbrains', 'org.intellij', 'javax.annotation'].each {
        relocate it, base + it
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class'
}

assemble.dependsOn shadowJar
