plugins {
    // Unobfuscated Loom for Minecraft 26.1+. It does not remap Minecraft or mods.
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base { archivesName = 'guildbridge' }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

// Compile core's sources and resources straight into the mod jar.
sourceSets.main.java.srcDir '../core/src/main/java'
sourceSets.main.resources.srcDir '../core/src/main/resources'

// Version and build time for !version, stamped into the jar at build time.
def buildInfoVersion = project.mod_version
def buildInfoTask = tasks.register('buildInfo') {
    def out = layout.buildDirectory.dir('generated/buildinfo')
    outputs.dir out
    outputs.upToDateWhen { false }
    doLast {
        def f = out.get().file('guildbridge/version-mod.properties').asFile
        f.parentFile.mkdirs()
        f.text = "version=${buildInfoVersion}\nbuilt=${System.currentTimeMillis()}\n"
    }
}
sourceSets.main.resources.srcDir(buildInfoTask)

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // No mappings line: 26.x ships with real names.
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    // No Discord library here anymore: the supervisor owns the bot. Minecraft already ships Gson.
}

processResources {
    def props = [version: version, loader_version: loader_version, minecraft_version: minecraft_version]
    inputs.properties props
    filesMatching('fabric.mod.json') { expand props }
}
